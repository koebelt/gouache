[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
gouache_math = { path = "crates/gouache_math" }
gouache_world = { path = "crates/gouache_world" }
gouache_procgen = { path = "crates/gouache_procgen" }
gouache_buildings = { path = "crates/gouache_buildings" }
gouache_paint = { path = "crates/gouache_paint" }
gouache_render = { path = "crates/gouache_render" }

wgpu = "30.0.2"
bevy = { version = "0.20.1", default-features = false }
glam = { version = "0.34.3", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
libm = "0.2.16"
rayon = "1.12.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
pollster = "1.0.1"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = "line-tables-only"
