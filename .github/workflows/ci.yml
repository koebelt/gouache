name: ci
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install lavapipe (software Vulkan)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Headless shot smoke test
        run: cargo run --release -p gouache_cli -- shot --bookmark bookmarks/g0_blocks_overview.json --out shot.png --width 640 --height 360 --frames 8
      - name: Determinism hashes
        run: cargo run --release -p gouache_cli -- hash --scene scenes/g0_blocks.json
      - uses: actions/upload-artifact@v4
        with:
          name: shot-${{ matrix.os }}
          path: shot.png
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
